<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="contenedor">
        <section class="contenedor-principal">
            <h1>AdminExpress</h1>
        </section>
        <section class="contenedorlogin">
            <h2>Let's <b>Sign In</b> &#128071;</h2>
            <h5>Hey, Enter your details to get sign in<br>to your account.</h5>
            <form class="contenedorinput" action="">
                <div class="grupoemail">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter Email">
                </div>
                <div class="grupopass">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Enter Password">
                </div>
                <a href="#" class="olvidecontraseña">Forgot Password?</a>
                <button class="boton">Sign In</button>
                <p class="crearuser">Don't have an account?<a href="#" class="registro"> Sign Up</a></p>
            
            </form>
        </section>
    </main>
</body>

</html>
